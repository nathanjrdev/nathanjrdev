.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.type{clip-path:inset(0 100% 0 0);animation:typing 3.5s steps(34) .8s forwards}
@keyframes typing{to{clip-path:inset(0 0 0 0)}}
</style>
